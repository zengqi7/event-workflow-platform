name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  benchmark-evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Audit and package sanitized historical evidence
        run: |
          python3 -m unittest discover -s capacity -p 'test_*.py'
          python3 capacity/evidence.py pack capacity/evidence/v0.1.0 dist/benchmark-evidence.tar.gz
      - name: Strict release verifier contracts
        shell: pwsh
        run: ./scripts/test-release-verifier.ps1
      - name: Release version and tag guards
        run: |
          bash scripts/release-preflight.sh snapshot
          if GITHUB_REF=refs/tags/v0.0.0 GITHUB_REF_NAME=v0.0.0 GITHUB_SHA=$(git rev-parse HEAD) bash scripts/release-preflight.sh tag; then
            echo 'mismatched version/tag was accepted' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-evidence
          path: dist/benchmark-evidence.tar.gz*
          if-no-files-found: error
          retention-days: 90

  test:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
        env:
          MYSQL_ROOT_PASSWORD: root-test-password
          MYSQL_DATABASE: event_workflow
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --protocol=tcp -proot-test-password --silent"
          --health-interval 5s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Unit tests
        run: go test -race ./...
      - name: Static analysis
        run: go vet ./...
      - name: Capacity tooling regression tests
        run: python3 -m unittest discover -s capacity -p 'test_*.py'
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Apply migrations
        env:
          MYSQL_DSN: root:root-test-password@tcp(127.0.0.1:3306)/event_workflow?parseTime=true&charset=utf8mb4&loc=UTC
        run: go run ./cmd/migrate
      - name: Integration tests
        env:
          INTEGRATION_MYSQL_DSN: root:root-test-password@tcp(127.0.0.1:3306)/event_workflow?parseTime=true&charset=utf8mb4&loc=UTC
          INTEGRATION_REDIS_ADDR: 127.0.0.1:6379
        run: go test -race -tags=integration ./integration

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          tags: event-workflow-platform:ci
