name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: release-test-only
          MYSQL_DATABASE: event_workflow
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --protocol=tcp -prelease-test-only --silent"
          --health-interval 5s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Validate exact release source
        env:
          OPA_BIN: /tmp/opa
          MYSQL_DSN: root:release-test-only@tcp(127.0.0.1:3306)/event_workflow?parseTime=true&charset=utf8mb4&loc=UTC
          INTEGRATION_MYSQL_DSN: root:release-test-only@tcp(127.0.0.1:3306)/event_workflow?parseTime=true&charset=utf8mb4&loc=UTC
          INTEGRATION_REDIS_ADDR: 127.0.0.1:6379
        run: |
          go test -race ./...
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
          go run ./cmd/migrate
          go test -race -count=1 -tags=integration ./integration
          docker compose --env-file .env.example config --quiet
          docker build -t event-workflow-platform:release-test .

  package:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build cross-platform packages
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          version=snapshot
          if [[ "$IS_TAG" == true ]]; then version="$RELEASE_VERSION"; fi
          bash scripts/package-release.sh "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: |
            dist/*/*.tar.gz
            dist/*/*.zip
            dist/*/checksums.txt
          if-no-files-found: error
      - name: Attest packages
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/*/*.tar.gz
            dist/*/*.zip
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_VERSION" --verify-tag --draft --generate-notes --title "$RELEASE_VERSION" dist/*/*.tar.gz dist/*/*.zip dist/*/checksums.txt
