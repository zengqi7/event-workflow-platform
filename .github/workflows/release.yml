name: release

on:
  push:
    tags: ['v0.1.0']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
        env:
          MYSQL_ROOT_PASSWORD: release-test-only
          MYSQL_DATABASE: event_workflow
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --protocol=tcp -prelease-test-only --silent"
          --health-interval 5s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Release preflight
        env:
          RELEASE_MODE: ${{ startsWith(github.ref, 'refs/tags/') && 'tag' || 'snapshot' }}
        run: bash scripts/release-preflight.sh "$RELEASE_MODE"
      - name: Validate exact release source
        env:
          MYSQL_DSN: root:release-test-only@tcp(127.0.0.1:3306)/event_workflow?parseTime=true&charset=utf8mb4&loc=UTC
          INTEGRATION_MYSQL_DSN: root:release-test-only@tcp(127.0.0.1:3306)/event_workflow?parseTime=true&charset=utf8mb4&loc=UTC
          INTEGRATION_REDIS_ADDR: 127.0.0.1:6379
        run: |
          go test -race ./...
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
          go run ./cmd/migrate
          go test -race -count=1 -tags=integration ./integration
          docker compose --env-file .env.example config --quiet
          docker build -t event-workflow-platform:release-test .

  package:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Build and verify cross-platform packages
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          version=snapshot
          if [[ "$IS_TAG" == true ]]; then version="$RELEASE_VERSION"; fi
          bash scripts/package-release.sh "$version"
          bash scripts/verify-release-assets.sh "dist/$version" "$version"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-packages
          path: |
            dist/*/*.tar.gz
            dist/*/*.zip
            dist/*/checksums.txt
          if-no-files-found: error
      - name: Attest packages
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            dist/*/*.tar.gz
            dist/*/*.zip
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: gh release create "$RELEASE_VERSION" --verify-tag --draft --generate-notes --title "$RELEASE_VERSION" dist/*/*.tar.gz dist/*/*.zip dist/*/checksums.txt
