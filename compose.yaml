name: event-workflow-platform

x-app-environment: &app-environment
  APP_ENV: docker
  MYSQL_DSN: "event_app:${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}@tcp(mysql:3306)/event_workflow?parseTime=true&charset=utf8mb4&loc=UTC"
  REDIS_ADDR: redis:6379
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}"
      MYSQL_DATABASE: event_workflow
      MYSQL_USER: event_app
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}"
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --protocol=tcp -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    entrypoint: ["/usr/local/bin/migrate"]
    environment:
      <<: *app-environment
      SEED_WEBHOOK_URL: "http://webhook-sink:18081/receive"
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    environment:
      <<: *app-environment
      HTTP_ADDR: "0.0.0.0:8080"
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  worker:
    build: .
    entrypoint: ["/usr/local/bin/worker"]
    environment:
      <<: *app-environment
      WEBHOOK_ALLOWED_HOSTS: webhook-sink
      WEBHOOK_ALLOW_DEVELOPMENT: "true"
      WORKER_METRICS_ADDR: 0.0.0.0:9091
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    ports:
      - "127.0.0.1:${WORKER_METRICS_PORT:-9091}:9091"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9091/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      webhook-sink:
        condition: service_healthy
    restart: unless-stopped

  webhook-sink:
    build: .
    entrypoint: ["/usr/local/bin/webhook-sink"]
    ports:
      - "127.0.0.1:${WEBHOOK_SINK_PORT:-18081}:18081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:18081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
