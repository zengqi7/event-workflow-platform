name: event-workflow-platform

x-app-environment: &app-environment
  APP_ENV: docker
  MYSQL_DSN: "event_app:${MYSQL_PASSWORD:-event-app-local-only}@tcp(mysql:3306)/event_workflow?parseTime=true&charset=utf8mb4&loc=UTC"
  REDIS_ADDR: redis:6379

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-event-root-local-only}"
      MYSQL_DATABASE: event_workflow
      MYSQL_USER: event_app
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-event-app-local-only}"
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ..
    entrypoint: ["/usr/local/bin/migrate"]
    environment:
      <<: *app-environment
      SEED_WEBHOOK_URL: "http://webhook-sink:18081/receive"
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
    environment:
      <<: *app-environment
      HTTP_ADDR: "0.0.0.0:8080"
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  worker:
    build:
      context: ..
    entrypoint: ["/usr/local/bin/worker"]
    environment:
      <<: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      webhook-sink:
        condition: service_healthy
    restart: unless-stopped

  webhook-sink:
    build:
      context: ..
    entrypoint: ["/usr/local/bin/webhook-sink"]
    ports:
      - "127.0.0.1:${WEBHOOK_SINK_PORT:-18081}:18081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:18081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
